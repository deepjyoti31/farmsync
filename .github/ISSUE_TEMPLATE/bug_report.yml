name: Bug report
description: Something in FarmSync is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please do not include passwords, API keys or personal farm data.
        For security vulnerabilities, follow SECURITY.md instead of opening a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Dashboard > Crops
        2. Click "Update Status"
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Farms / Fields / Maps
        - Crops / Harvests
        - Livestock
        - Inventory / Equipment
        - Finances / Loans / Insurance
        - Weather
        - IoT Sensors
        - Analytics / Reports
        - Market / Community
        - Cooperative / Organizations
        - Compliance / Sustainability
        - Authentication / Settings
        - Database / Migrations
        - Other
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Chrome 130 on Android 14
  - type: textarea
    id: logs
    attributes:
      label: Console errors or screenshots
      description: Paste any errors from the browser console. Remove sensitive data first.
      render: shell
